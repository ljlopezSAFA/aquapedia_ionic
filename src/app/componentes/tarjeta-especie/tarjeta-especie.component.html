<ion-card [routerLink]="['/app/especies', especie().id]" [button]="true">
  <div class="foto">
    @if (!sinFoto) {
      <img [src]="especie().foto" [alt]="especie().nombreComun" loading="lazy" (error)="sinFoto = true" />
    } @else {
      <ion-icon class="sin-foto" [name]="especie().tipo === 'PLANTA' ? 'leaf-outline' : 'fish-outline'"></ion-icon>
    }
    <span class="favorita" [class.activa]="especie().favorita">
      <ion-icon [name]="especie().favorita ? 'heart' : 'heart-outline'"></ion-icon>
    </span>
  </div>

  <div class="cuerpo">
    <h3>{{ especie().nombreComun }}</h3>
    <p class="cientifico">{{ especie().nombreCientifico }}</p>
    <div class="pie">
      <app-chip-dificultad [dificultad]="especie().dificultad" />
      <span class="temperatura">
        <ion-icon name="thermometer-outline"></ion-icon>
        {{ especie().temperatura.min }}–{{ especie().temperatura.max }}°
      </span>
    </div>
  </div>
</ion-card>
